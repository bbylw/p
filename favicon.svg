<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Continuous-curvature squircle, inset 4 from the canvas -->
    <path id="squircle"
      d="M34 4H94C114.4 4 124 13.6 124 34V94C124 114.4 114.4 124 94 124H34C13.6 124 4 114.4 4 94V34C4 13.6 13.6 4 34 4Z" />
    <clipPath id="frame">
      <path d="M34 4H94C114.4 4 124 13.6 124 34V94C124 114.4 114.4 124 94 124H34C13.6 124 4 114.4 4 94V34C4 13.6 13.6 4 34 4Z" />
    </clipPath>

    <!-- Night sky, key light from the upper left -->
    <radialGradient id="sky" cx="32%" cy="20%" r="100%">
      <stop offset="0" stop-color="#252c55" />
      <stop offset="52%" stop-color="#12152e" />
      <stop offset="100%" stop-color="#05060d" />
    </radialGradient>

    <!-- Ambient light: warm upper left, cool lower right -->
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9a45" stop-opacity="0.46" />
      <stop offset="55%" stop-color="#ff4d73" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ff4d73" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coolGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2ad6f2" stop-opacity="0.4" />
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Metal edge ring, warm around to cool -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd28a" />
      <stop offset="45%" stop-color="#f4798f" />
      <stop offset="100%" stop-color="#4ec9f2" />
    </linearGradient>

    <!-- Glass rims: white from above, cyan bounce from the lower right -->
    <linearGradient id="rimTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5" />
      <stop offset="38%" stop-color="#fff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rimBottom" x1="1" y1="1" x2="0.5" y2="0.5">
      <stop offset="0" stop-color="#9ceaff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#9ceaff" stop-opacity="0" />
    </linearGradient>

    <!-- Blade: sunlit gold at the tip, cooling to rose at the tail -->
    <linearGradient id="blade" x1="15%" y1="0" x2="80%" y2="100%">
      <stop offset="0" stop-color="#fff3d6" />
      <stop offset="28%" stop-color="#ffbb5e" />
      <stop offset="62%" stop-color="#f96a63" />
      <stop offset="100%" stop-color="#dd3560" />
    </linearGradient>

    <!-- Wake streaks, fading out behind the tail -->
    <linearGradient id="wake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd2a8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ff8a4d" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5.5" />
    </filter>
    <filter id="cast" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Base plate -->
  <use href="#squircle" fill="url(#sky)" stroke="url(#edge)" stroke-width="4" />

  <g clip-path="url(#frame)">
    <!-- Atmosphere -->
    <ellipse cx="28" cy="24" rx="46" ry="40" fill="url(#warmGlow)" />
    <ellipse cx="104" cy="108" rx="50" ry="42" fill="url(#coolGlow)" />

    <!-- Glass rims -->
    <use href="#squircle" fill="none" stroke="url(#rimTop)" stroke-width="2.4" />
    <use href="#squircle" fill="none" stroke="url(#rimBottom)" stroke-width="2.4" />

    <g transform="rotate(45 64 64)">
      <!-- Light spill -->
      <path d="M64 21L92 97 64 81 36 97Z" fill="#ff8f45" filter="url(#glow)" opacity="0.45" />

      <!-- Cast shadow, thrown away from the key light -->
      <g transform="translate(4.5 0)">
        <path d="M64 21L92 97 64 81 36 97Z" fill="#04050e" stroke="#04050e" stroke-width="6.5"
          stroke-linejoin="round" filter="url(#cast)" opacity="0.5" />
      </g>

      <!-- Wake, tucked under the tail -->
      <path d="M50 109.5 64 100 78 109.5" fill="none" stroke="url(#wake)" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round" />
      <path d="M57 119 64 113 71 119" fill="none" stroke="url(#wake)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />

      <!-- Kite blade -->
      <path d="M64 21L92 97 64 81 36 97Z" fill="url(#blade)" stroke="url(#blade)" stroke-width="6.5"
        stroke-linejoin="round" />

      <!-- Specular on the lit edge, cyan bounce on the shadow edge -->
      <path d="M61.4 34 47 72" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.5" />
      <path d="M68.8 38 84.6 82" stroke="#d8f3ff" stroke-width="2" stroke-linecap="round" opacity="0.26" />
    </g>
  </g>

  <!-- Sparkle: the point of light the blade is aiming at -->
  <path d="M104 13Q105.4 21.6 114 23 105.4 24.4 104 33 102.6 24.4 94 23 102.6 21.6 104 13Z"
    fill="#fff" opacity="0.9" />
</svg>
