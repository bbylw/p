<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2030" />
      <stop offset="100%" stop-color="#0a0a12" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb057" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Needle North Facet Left -->
    <linearGradient id="needleNorthLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffca6e" />
      <stop offset="55%" stop-color="#ff8c38" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Needle North Facet Right -->
    <linearGradient id="needleNorthRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffc178" />
      <stop offset="100%" stop-color="#ff6b2b" />
    </linearGradient>

    <!-- Needle South Facet Left -->
    <linearGradient id="needleSouthLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cc3f7" />
      <stop offset="100%" stop-color="#0b7cc4" />
    </linearGradient>

    <!-- Needle South Facet Right -->
    <linearGradient id="needleSouthRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6f0ff" />
      <stop offset="100%" stop-color="#5cc8fb" />
    </linearGradient>

    <!-- Ambient Glow Behind Needle -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8c38" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#ff4b72" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="5" />

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="46" fill="url(#glow)" />

  <!-- Compass Needle -->
  <g transform="rotate(45 64 64)">
    <!-- South-Left -->
    <path d="M64 64 L38 64 L64 112 Z" fill="url(#needleSouthLeft)" />
    <!-- South-Right -->
    <path d="M64 64 L90 64 L64 112 Z" fill="url(#needleSouthRight)" />
    <!-- North-Left -->
    <path d="M64 64 L38 64 L64 14 Z" fill="url(#needleNorthLeft)" />
    <!-- North-Right -->
    <path d="M64 64 L90 64 L64 14 Z" fill="url(#needleNorthRight)" />

    <!-- Center Pivot -->
    <circle cx="64" cy="64" r="6" fill="#ffffff" stroke="#0a0a12" stroke-width="2.5" />
  </g>
</svg>
